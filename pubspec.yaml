name: image_gallery
description: "Production-style infinite image gallery built with clean architecture and Cubit."
publish_to: 'none'
version: 1.0.0+1

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: "assets/icon/app_icon.png"

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Networking
  dio: ^5.8.0+1

  # Env files
  flutter_dotenv: ^5.2.1

  # Local persistence
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5

  # UI
  cached_network_image: ^3.4.1
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0
  intl: ^0.20.2

  # Platform
  share_plus: ^11.0.0

  # DI
  get_it: ^8.0.3
  gal: ^2.3.3
  flutter_launcher_icons: ^0.14.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icon/app_icon.png
